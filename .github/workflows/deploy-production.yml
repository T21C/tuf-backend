name: Build and deploy production

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: tuf-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Commit association for Sentry releases
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install, test, and build
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          npm ci
          npm test
          npm run build

      - name: Decide Sentry upload
        id: sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_SKIP_UPLOAD: ${{ vars.SENTRY_SKIP_UPLOAD }}
        run: |
          set -euo pipefail
          # secrets.* cannot be referenced in if: expressions; gate via step output instead.
          if [[ "${SENTRY_SKIP_UPLOAD}" == "true" || -z "${SENTRY_AUTH_TOKEN}" ]]; then
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

      # Prefer omitting empty SENTRY_URL — empty string breaks sentry-cli ("unknown scheme ()").
      # Note: `secrets` cannot be referenced in `if:` — gate with vars only; missing token fails the action.
      - name: Configure Sentry URL

        if: ${{ vars.SENTRY_SKIP_UPLOAD != 'true' }}
        run: |
          if [[ -n "${{ vars.SENTRY_URL }}" ]]; then
            echo "SENTRY_URL=${{ vars.SENTRY_URL }}" >> "$GITHUB_ENV"
          else
            echo "SENTRY_URL=https://sentry.tuforums.com" >> "$GITHUB_ENV"
          fi

      - name: Create Sentry release and upload sourcemaps

        if: ${{ vars.SENTRY_SKIP_UPLOAD != 'true' }}

        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG != '' && vars.SENTRY_ORG || 'the-universal-forums' }}
          SENTRY_PROJECT: ${{ vars.SENTRY_SERVER_PROJECT != '' && vars.SENTRY_SERVER_PROJECT || 'main-server' }}
        with:
          environment: production
          # Must match GIT_SHA / SENTRY_RELEASE baked into the runtime image.
          release: ${{ github.sha }}
          sourcemaps: ./dist
          inject: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/t21c/tuf-backend:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Connect to Tailscale
        if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gh-runner
          ping: tuf-main-server

      - name: Configure deploy SSH identity
        if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
        env:
          DEPLOY_KEY: ${{ secrets.TUF_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TUF_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy backend production
        if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 tuf-deploy@tuf-main-server \
            "sudo /srv/tuf/infra/bin/tuf-deploy-backend '${{ github.sha }}'"
