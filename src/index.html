<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Universal Forums</title>
  <meta name="description" content="A community specialized in custom levels and clears of A Dance of Fire and Ice.">
  <link rel="canonical" href="https://tuforums.com/">
  <meta property="og:title" content="The Universal Forums">
  <meta property="og:description" content="A community specialized in custom levels and clears of A Dance of Fire and Ice.">
  <meta property="og:url" content="https://tuforums.com/">
  <link rel="icon" href="/favicon.ico">
  <style>
    @property --tuf-rainbow-angle {
      syntax: "<angle>";
      inherits: true;
      initial-value: 0deg;
    }
    @keyframes tuf-rainbow-spin {
      to {
        --tuf-rainbow-angle: 360deg;
      }
    }
    .tuf-api-home {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:#090909;
      color: #f9fafb;
      font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .tuf-api-home__panel {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: min(100%, 36rem);
    }
    .tuf-api-home__logo {
      width: min(100%, 34rem);
      height: auto;
      filter:
        drop-shadow(0 0 1px #f9fafb)
        drop-shadow(0 0 1px #f9fafb);
    }
    .tuf-api-home h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 2.75rem);
      line-height: 1.1;
    }
    .tuf-api-home h1 span {
      position: relative;
      display: inline-block;
      isolation: isolate;
      color: #ee3b48;
      white-space: nowrap;
      animation: tuf-rainbow-spin 6s linear infinite;
    }
    .tuf-api-home h1 span::before,
    .tuf-api-home h1 span::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      background-image: conic-gradient(
        from var(--tuf-rainbow-angle),
        #ff2a2a,
        #ff8c00,
        #ffe14a,
        #3dff6e,
        #2adfff,
        #3d6dff,
        #b44bff,
        #ff3ec2,
        #ff2a2a
      );
      background-size: 500% 500%;
      background-position: 50% -500%;
      pointer-events: none;
      white-space: nowrap;
    }
    .tuf-api-home h1 span::before {
      z-index: 0;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: blur(0.38em);
      opacity: 0.95;
    }
    .tuf-api-home h1 span::after {
      z-index: 1;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-mask-image: linear-gradient(#000 0 0);
      mask-image: linear-gradient(#000 0 0);
      -webkit-mask-clip: text;
      mask-clip: text;
      -webkit-text-fill-color: transparent;
    }
    @media (prefers-reduced-motion: reduce) {
      .tuf-api-home h1 span {
        animation: none;
      }
    }
    .tuf-api-home p {
      margin: 0;
      max-width: 38rem;
      color: #cacaca;
      line-height: 1.55;
    }
    .tuf-api-home__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 0.25rem;
    }
    .tuf-api-home__actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.7rem 1rem;
      border-radius: 0.4rem;
      font-size: 0.9375rem;
      font-weight: 500;
      text-decoration: none;
    }
    .tuf-api-home__primary {
      background: #5b3dd4;
      color: #f9fafb;
    }
    .tuf-api-home__secondary {
      background: transparent;
      color: #f9fafb;
      box-shadow: inset 0 0 0 1px rgba(249, 250, 251, 0.24);
    }
  </style>
</head>
<body class="tuf-api-home">
  <main class="tuf-api-home__panel">
    <img class="tuf-api-home__logo" src="/logo-full.svg" alt="The Universal Forums">
    <h1>Everything for <span data-text="A Dance of Fire and Ice">A Dance of Fire and Ice</span></h1>
    <p>
      This is the API for The Universal Forums. Browse levels and the leaderboard on the main site.
    </p>
    <div class="tuf-api-home__actions">
      <a class="tuf-api-home__primary" href="https://tuforums.com/">Open tuforums.com</a>
      <a class="tuf-api-home__secondary" href="https://tuforums.com/about">About the community</a>
    </div>
  </main>
</body>
</html>
